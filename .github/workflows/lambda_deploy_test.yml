name: Lambda Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select Environment'
        type: choice
        required: true
        default: 'QA'
        options:
          - QA
          - STAGING
          - UAT
          - SEA
          - CA
          - AU
          - EU
          - US
          - SG
          - GCC
          - WWW

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Run workflow2
        run: echo "Selected tag is ${{ github.ref_name }}"

      - name: Fetch Userlist
        id: readUsernames
        run: |
          echo "::set-output name=usernames::$(cat lambda_info.json | tr '\n' ' ')"

      - name: Check if this github user is added in the list
        run: |
          desired_usernames=(${{ steps.readUsernames.outputs.usernames }})

      - run: |
          echo '${{ steps.readUsernames.outputs.usernames }}'
          echo '${{ steps.readUsernames.outputs.usernames && fromJson(steps.readUsernames.outputs.usernames).QA.source_aws_region }}'
          echo '${{ steps.readUsernames.outputs.usernames && fromJson(steps.readUsernames.outputs.usernames).QA.destination_lambda_arn }}'
          
